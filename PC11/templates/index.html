<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PC.11 — Análise de Sentimentos</title>
  {% include "_estilo.html" %}
</head>
<body>
  <h1>Análise de sentimentos de avaliações</h1>
  <p>BOW com TF-IDF + KNeighborsClassifier. Negativa = 1 ponto, neutra = 3, positiva = 5.</p>

  <form method="post">
    <label>Produto (opcional, só aparece como título do resultado)
      <input name="produto" value="{{ produto }}" placeholder="Ex.: Panela de Pressão 4,5 L">
    </label>
    <label>Avaliações (uma por linha)
      <textarea name="avaliacoes" rows="6" required placeholder="Ex.:&#10;Produto excelente, chegou antes do prazo.&#10;Veio com defeito e a troca demorou.">{{ avaliacoes }}</textarea>
    </label>
    <button type="submit">Analisar</button>
  </form>

  {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}

  {% if resultado %}
  {% include "_resultado.html" %}
  {% endif %}
</body>
</html>
